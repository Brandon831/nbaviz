name: Update NBA dashboard

# Rebuilds the dashboard from the newest public data every morning and publishes it with GitHub Pages.
# One-time setup: in the repository, open Settings > Pages and set Source to "GitHub Actions".
on:
  schedule:
    - cron: '30 11 * * *'      # 11:30 UTC, about 7:30 in the morning Eastern, after the previous night's games are posted
  workflow_dispatch:           # also lets you run it by hand from the Actions tab

permissions:
  contents: write          # the build commits each day's injury report to logs/injuries/
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Keep finished seasons between runs
        uses: actions/cache@v4
        with:
          path: raw
          key: raw-finished-seasons-v2-${{ hashFiles('nba_build.py') }}
          restore-keys: raw-finished-seasons-v2-
      - name: Build the dashboard
        # --history 2003 also writes one file per season back to 2002-03 into docs/data/, which the page loads on demand
        run: python nba_build.py --raw raw --out docs/index.html --history 2003
      - name: Check the result before publishing it
        run: python check_build.py docs/index.html
      - name: Keep the day's injury report in the repository
        # logs/injuries/<date>.json: check_injuries.py compares these with who actually dressed, to measure the status weights.
        # Needs Settings > Actions > General > Workflow permissions set to "Read and write"; if the push is refused, the run still
        # publishes the page and the log is kept as a downloadable artifact instead.
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain logs 2>/dev/null)" ]; then
            git config user.name "nba-dashboard bot"; git config user.email "actions@users.noreply.github.com"
            git add logs && git commit -m "Injury report $(date -u +%F)" && git push || echo "::warning::Could not push logs/injuries (check Settings > Actions > General > Workflow permissions: Read and write). The page was still built."
          fi
      - name: Keep the injury log as an artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: injury-log
          path: logs/injuries
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

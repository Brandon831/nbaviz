name: Update NBA dashboard

# Rebuilds the dashboard from the newest public data every morning and publishes it with GitHub Pages.
# One-time setup: in the repository, open Settings > Pages and set Source to "GitHub Actions".
on:
  schedule:
    - cron: '30 11 * * *'      # 11:30 UTC, about 7:30 in the morning Eastern, after the previous night's games are posted
  workflow_dispatch:           # also lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Keep finished seasons between runs
        uses: actions/cache@v4
        with:
          path: raw
          key: raw-finished-seasons-v1-${{ hashFiles('nba_build.py') }}
          restore-keys: raw-finished-seasons-v1-
      - name: Build the dashboard
        run: python nba_build.py --raw raw --out docs/index.html
      - name: Check the result before publishing it
        run: python check_build.py docs/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
